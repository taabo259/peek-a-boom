<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Bomb Defusal</title>


<style>

    /* =========================
       基本設定
    ========================= */

    * {
        box-sizing: border-box;

        -webkit-tap-highlight-color: transparent;
    }


    html,
    body {

        margin: 0;

        width: 100%;
        height: 100%;

        overflow: hidden;

        background: #ffffff;
        color: #000000;

        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Helvetica Neue",
            Arial,
            sans-serif;
    }


    body {

        display: flex;

        justify-content: center;
        align-items: center;

        user-select: none;
    }


    /* =========================
       ゲーム画面
    ========================= */

    #game {

        width: 100%;
        height: 100%;

        position: relative;

        display: flex;

        flex-direction: column;

        align-items: center;

        justify-content: center;

        background: #ffffff;
    }


    /* =========================
       タイマー
    ========================= */

    #timer {

        /*
            タイマーの幅を固定

            これによって数字が変わっても
            タイマー全体の位置が動かない
        */

        width: 8ch;

        text-align: center;


        /*
            数字をすべて同じ幅にする

            100.00
            99.99
            88.88
            11.11

            のように数字が変化しても
            横方向にずれない
        */

        font-variant-numeric: tabular-nums;

        font-feature-settings:
            "tnum";


        font-size:
            clamp(70px, 18vw, 180px);

        font-weight: 300;

        line-height: 1;

        letter-spacing: 0;

        margin-bottom: 60px;

        text-align: center;

        white-space: nowrap;


        transition:
            color 0.2s,
            transform 0.2s;
    }


    /* =========================
       残り20秒以下
    ========================= */

    #timer.warning {

        animation:
            warningPulse 0.8s infinite;
    }


    @keyframes warningPulse {

        0%,
        100% {

            transform:
                scale(1);
        }

        50% {

            transform:
                scale(1.05);
        }
    }


    /* =========================
       入力欄
    ========================= */

    #answer {

        width:
            min(75vw, 600px);

        height: 70px;

        border: none;

        border-bottom:
            3px solid #000000;

        background:
            transparent;

        font-size: 40px;

        text-align: center;

        outline: none;

        border-radius: 0;


        user-select: text;

        -webkit-user-select: text;
    }


    /* =========================
       右上タップ領域
    ========================= */

    #controlArea {

        /*
            右上の透明な操作領域

            ここだけがゲーム開始・
            リセットに反応する
        */

        position: absolute;

        top: 0;
        right: 0;

        width: 120px;
        height: 120px;

        z-index: 20;

        /*
            透明なので画面には表示されない
        */

        background: transparent;

        cursor: pointer;

        touch-action: manipulation;
    }


    /* =========================
       結果画面
    ========================= */

    #result {

        position: absolute;

        top: 0;
        left: 0;

        width: 100%;
        height: 100%;

        display: none;

        justify-content: center;
        align-items: center;

        text-align: center;

        z-index: 10;
    }


    #resultText {

        font-size:
            clamp(60px, 15vw, 160px);

        font-weight: 700;

        letter-spacing: 0.08em;
    }


    /* =========================
       解除成功
    ========================= */

    .success {

        background: #ffffff;

        color: #000000;
    }


    .success #resultText {

        animation:
            successAnimation
            1.5s
            ease-out
            forwards;
    }


    @keyframes successAnimation {

        0% {

            opacity: 0;

            transform:
                scale(0.3);
        }

        40% {

            opacity: 1;

            transform:
                scale(1.2);
        }

        70% {

            transform:
                scale(0.95);
        }

        100% {

            transform:
                scale(1);
        }
    }


    /* =========================
       爆発
    ========================= */

    .explosion {

        background: #000000;

        color: #ffffff;
    }


    .explosion #resultText {

        animation:
            explosionAnimation
            1.5s
            ease-out
            forwards;
    }


    @keyframes explosionAnimation {

        0% {

            opacity: 0;

            transform:
                scale(0.3);
        }

        40% {

            opacity: 1;

            transform:
                scale(1.2);
        }

        70% {

            transform:
                scale(0.95);
        }

        100% {

            opacity: 1;

            transform:
                scale(1);
        }
    }


    /* =========================
       スマートフォン
    ========================= */

    @media (max-width: 600px) {

        #timer {

            margin-bottom: 50px;

            /*
                スマートフォンでも
                固定幅を維持
            */

            width: 8ch;
        }


        #answer {

            width: 75vw;

            height: 60px;

            font-size: 32px;
        }


        /*
            スマートフォンでは
            右上の操作範囲を少し小さくする
        */

        #controlArea {

            width: 100px;

            height: 100px;
        }
    }

</style>

</head>


<body>


<div id="game">


    <!--
        右上の透明な操作エリア

        待機中
        → タイマー開始

        成功・爆発後
        → リセット
    -->

    <div id="controlArea"></div>


    <!-- タイマー -->

    <div id="timer">
        100.00
    </div>


    <!-- 入力欄 -->

    <input
        type="text"

        id="answer"

        autocomplete="off"

        autocorrect="off"

        autocapitalize="off"

        spellcheck="false"
    >


    <!-- 結果画面 -->

    <div id="result">

        <div id="resultText"></div>

    </div>

</div>



<script>


    /* =========================
       設定
    ========================= */

    const ANSWER = "だかい";

    const START_TIME = 100.00;


    /* =========================
       HTML要素
    ========================= */

    const timerElement =
        document.getElementById(
            "timer"
        );


    const answerElement =
        document.getElementById(
            "answer"
        );


    const resultElement =
        document.getElementById(
            "result"
        );


    const resultTextElement =
        document.getElementById(
            "resultText"
        );


    const controlArea =
        document.getElementById(
            "controlArea"
        );


    /* =========================
       状態
    ========================= */

    let timeLeft =
        START_TIME;


    let timer = null;


    let startTime = null;


    /*
        waiting
        ↓
        開始前

        running
        ↓
        カウントダウン中

        success
        ↓
        解除成功

        exploded
        ↓
        爆発
    */

    let state =
        "waiting";


    /* =========================
       タイマー表示
    ========================= */

    function updateTimer() {


        /*
            小数第2位まで表示

            100.00
            99.99
            99.98
            ...
            0.01
            0.00
        */

        timerElement.textContent =
            timeLeft.toFixed(2);


        /*
            残り20秒以下
        */

        if (
            timeLeft <= 20
        ) {

            timerElement.classList.add(
                "warning"
            );

        } else {

            timerElement.classList.remove(
                "warning"
            );
        }
    }


    /* =========================
       ゲーム開始
    ========================= */

    function startGame() {


        /*
            待機中以外は開始しない
        */

        if (
            state !== "waiting"
        ) {

            return;
        }


        state =
            "running";


        /*
            開始時刻を記録
        */

        startTime =
            performance.now();


        /*
            入力欄にフォーカス
        */

        answerElement.focus();


        /*
            約10msごとに更新
        */

        timer =
            setInterval(
                () => {


                    /*
                        実際の経過時間を計算
                    */

                    const elapsed =
                        (
                            performance.now()
                            -
                            startTime
                        )
                        /
                        1000;


                    /*
                        残り時間
                    */

                    timeLeft =
                        Math.max(
                            0,

                            START_TIME
                            -
                            elapsed
                        );


                    updateTimer();


                    /*
                        0秒になった
                    */

                    if (
                        timeLeft <= 0
                    ) {

                        clearInterval(
                            timer
                        );


                        timeLeft =
                            0;


                        updateTimer();


                        explode();
                    }

                },

                10
            );
    }


    /* =========================
       正解判定
    ========================= */

    answerElement.addEventListener(
        "input",

        function () {


            /*
                カウントダウン中
                以外は判定しない
            */

            if (
                state !== "running"
            ) {

                return;
            }


            const answer =
                answerElement.value.trim();


            /*
                正解
            */

            if (
                answer === ANSWER
            ) {

                defuse();
            }

        }
    );


    /* =========================
       解除成功
    ========================= */

    function defuse() {


        if (
            state !== "running"
        ) {

            return;
        }


        state =
            "success";


        clearInterval(
            timer
        );


        /*
            成功画面
        */

        resultElement.style.display =
            "flex";


        resultElement.className =
            "success";


        resultTextElement.textContent =
            "解除成功";


        /*
            入力欄から
            フォーカスを外す
        */

        answerElement.blur();
    }


    /* =========================
       爆発
    ========================= */

    function explode() {


        if (
            state !== "running"
        ) {

            return;
        }


        state =
            "exploded";


        /*
            爆発画面
        */

        resultElement.style.display =
            "flex";


        resultElement.className =
            "explosion";


        resultTextElement.textContent =
            "爆発";
    }


    /* =========================
       リセット
    ========================= */

    function resetGame() {


        /*
            成功または爆発時だけ
            リセット可能
        */

        if (
            state !== "success" &&
            state !== "exploded"
        ) {

            return;
        }


        clearInterval(
            timer
        );


        /*
            初期状態へ
        */

        timeLeft =
            START_TIME;


        state =
            "waiting";


        startTime =
            null;


        /*
            タイマー表示を戻す
        */

        updateTimer();


        /*
            入力欄を空にする
        */

        answerElement.value =
            "";


        /*
            警告表示を解除
        */

        timerElement.classList.remove(
            "warning"
        );


        /*
            結果画面を消す
        */

        resultElement.style.display =
            "none";


        resultElement.className =
            "";


        resultTextElement.textContent =
            "";


        /*
            フォーカスを外す
        */

        answerElement.blur();
    }


    /* =========================
       右上タップ
    ========================= */

    controlArea.addEventListener(
        "pointerdown",

        function (event) {


            /*
                タップイベントが
                他の場所に伝わるのを防ぐ
            */

            event.stopPropagation();


            /*
                開始前なら開始
            */

            if (
                state === "waiting"
            ) {

                startGame();

                return;
            }


            /*
                成功・爆発後ならリセット
            */

            if (
                state === "success" ||
                state === "exploded"
            ) {

                resetGame();

                return;
            }

        }
    );


    /* =========================
       初期化
    ========================= */

    updateTimer();

</script>

</body>

</html>
