<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Bomb Defusal</title>


<style>

/* =========================================
   基本設定
========================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}


html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #ffffff;
    color: #000000;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
}


body {

    display: flex;

    justify-content: center;
    align-items: center;

    user-select: none;
}


/* =========================================
   ゲーム画面
========================================= */

#game {

    width: 100%;
    height: 100%;

    position: relative;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    background: #ffffff;

    overflow: hidden;
}


/* =========================================
   結果演出中
   元のタイマー・入力欄を完全に隠す
========================================= */

#game.resultMode #timer,
#game.resultMode #answer {

    visibility: hidden;
}


/* =========================================
   タイマー
========================================= */

#timer {

    width: 8ch;

    text-align: center;

    /*
        数字を等幅にする
        → カウントダウン中の横ズレ防止
    */

    font-variant-numeric: tabular-nums;

    font-feature-settings: "tnum";

    font-size:
        clamp(70px, 18vw, 180px);

    font-weight: 300;

    line-height: 1;

    letter-spacing: 0;

    margin-bottom: 60px;

    white-space: nowrap;

    transition:
        color 0.2s,
        transform 0.2s;
}


/* =========================================
   残り時間警告
========================================= */

#timer.warning {

    animation:
        warningPulse 0.8s infinite;
}


@keyframes warningPulse {

    0%,
    100% {

        transform: scale(1);
    }

    50% {

        transform: scale(1.05);
    }
}


/* =========================================
   入力欄
========================================= */

#answer {

    width:
        min(75vw, 600px);

    height: 70px;

    border: none;

    border-bottom:
        3px solid #000000;

    background:
        transparent;

    font-size: 40px;

    text-align: center;

    outline: none;

    border-radius: 0;

    user-select: text;

    -webkit-user-select: text;
}


/* =========================================
   右上の操作領域
========================================= */

#controlArea {

    /*
        右上の隅だけを
        スタート・リセット可能にする
    */

    position: absolute;

    top: 0;
    right: 0;

    width: 120px;
    height: 120px;

    z-index: 50;

    background: transparent;

    cursor: pointer;

    touch-action: manipulation;
}


/* =========================================
   結果画面
========================================= */

#result {

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    display: none;

    justify-content: center;
    align-items: center;

    text-align: center;

    z-index: 20;

    overflow: hidden;
}


/* =========================================
   結果文字
========================================= */

#resultText {

    position: relative;

    z-index: 30;

    font-size:
        clamp(48px, 13vw, 150px);

    font-weight: 700;

    letter-spacing: 0.08em;

    opacity: 0;
}


/* =========================================
   最終結果文字
========================================= */

#finalMessage {

    position: absolute;

    z-index: 40;

    font-size:
        clamp(38px, 9vw, 100px);

    font-weight: 700;

    letter-spacing: 0.08em;

    opacity: 0;

    transform: scale(0.7);
}


/* =================================================
   解除成功演出
================================================= */

.success {

    background:
        radial-gradient(
            circle at center,
            #ffffff 0%,
            #fffde7 18%,
            #fff59d 40%,
            #b3f5ff 70%,
            #d9c7ff 100%
        );

    color: #111;

    animation:
        successBackground 2s
        ease-out forwards;

    overflow: hidden;
}


/* =========================================
   成功時の中央フラッシュ
========================================= */

.success::before {

    content: "";

    position: absolute;

    top: 50%;
    left: 50%;

    width: 30px;
    height: 30px;

    border-radius: 50%;

    background: #ffffff;

    transform:
        translate(-50%, -50%)
        scale(1);

    box-shadow:
        0 0 30px #ffffff,
        0 0 70px #fff700,
        0 0 120px #00ddff,
        0 0 180px #ff66dd;

    animation:
        successBurst
        1.5s
        cubic-bezier(0.15, 0.8, 0.2, 1)
        forwards;

    z-index: 1;
}


@keyframes successBurst {

    0% {

        width: 20px;
        height: 20px;

        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1);
    }

    25% {

        width: 150px;
        height: 150px;

        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1.5);
    }

    100% {

        width: 180vmax;
        height: 180vmax;

        opacity: 0;

        transform:
            translate(-50%, -50%)
            scale(1);
    }
}


/* =========================================
   成功時の背景変化
========================================= */

@keyframes successBackground {

    0% {

        background: #ffffff;
    }

    20% {

        background: #fff59d;
    }

    45% {

        background: #b3f5ff;
    }

    70% {

        background: #e1c7ff;
    }

    100% {

        background:
            radial-gradient(
                circle,
                #ffffff 0%,
                #eafcff 50%,
                #f3e9ff 100%
            );
    }
}


/* =========================================
   成功文字
========================================= */

.success #resultText {

    font-size:
        clamp(42px, 11vw, 130px);

    font-weight: 900;

    color: #111;

    text-shadow:
        0 0 10px #ffffff,
        0 0 25px #fff700,
        0 0 45px #00ddff;

    animation:
        successText
        1.2s
        cubic-bezier(0.15, 0.9, 0.2, 1)
        forwards;

    z-index: 20;
}


@keyframes successText {

    0% {

        opacity: 0;

        transform:
            scale(0.1)
            rotate(-10deg);
    }

    35% {

        opacity: 1;

        transform:
            scale(1.3)
            rotate(3deg);
    }

    55% {

        transform:
            scale(0.9)
            rotate(-1deg);
    }

    75% {

        transform:
            scale(1.08)
            rotate(0deg);
    }

    100% {

        opacity: 1;

        transform:
            scale(1)
            rotate(0deg);
    }
}


/* =========================================
   紙吹雪
========================================= */

.success .confetti {

    position: absolute;

    top: -30px;

    width: 12px;
    height: 22px;

    opacity: 0;

    z-index: 10;

    animation:
        confettiFall
        var(--duration)
        linear
        var(--delay)
        forwards;

    transform:
        rotate(var(--rotation));
}


@keyframes confettiFall {

    0% {

        opacity: 1;

        transform:
            translate3d(
                0,
                -30px,
                0
            )
            rotate(0deg);
    }

    20% {

        opacity: 1;
    }

    100% {

        opacity: 0;

        transform:
            translate3d(
                var(--x),
                110vh,
                0
            )
            rotate(
                var(--rotation)
            );
    }
}


/* =========================================
   成功時の光の粒
========================================= */

.success .spark {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 10px;
    height: 10px;

    border-radius: 50%;

    background: #ffffff;

    box-shadow:
        0 0 10px #ffffff,
        0 0 20px #00ddff;

    z-index: 15;

    animation:
        sparkAnimation
        1.8s
        cubic-bezier(0.1, 0.8, 0.2, 1)
        forwards;
}


@keyframes sparkAnimation {

    0% {

        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(0.3);
    }

    30% {

        opacity: 1;

        transform:
            translate(
                calc(-50% + var(--x1)),
                calc(-50% + var(--y1))
            )
            scale(1.5);
    }

    100% {

        opacity: 0;

        transform:
            translate(
                calc(-50% + var(--x2)),
                calc(-50% + var(--y2))
            )
            scale(0);
    }
}


/* =================================================
   爆発演出
================================================= */

.explosion {

    background: #000000;

    color: #ffffff;
}


/* =========================================
   爆発の光
========================================= */

.explosion::before {

    content: "";

    position: absolute;

    width: 30px;
    height: 30px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #ffffff 0%,
            #ffff66 15%,
            #ff9900 35%,
            #ff3300 60%,
            transparent 72%
        );

    box-shadow:
        0 0 30px #ffffff,
        0 0 80px #ff9900,
        0 0 150px #ff3300;

    animation:
        explosionBurst
        1.1s
        ease-out forwards;
}


@keyframes explosionBurst {

    0% {

        width: 30px;
        height: 30px;

        opacity: 1;

        transform: scale(1);
    }

    25% {

        width: 180px;
        height: 180px;

        opacity: 1;

        transform: scale(1.5);
    }

    100% {

        width: 100vmax;
        height: 100vmax;

        opacity: 0;

        transform: scale(1);
    }
}


/* =========================================
   爆発時の画面揺れ
========================================= */

.explosion.shake {

    animation:
        screenShake
        0.6s
        ease-out;
}


@keyframes screenShake {

    0% {
        transform: translate(0, 0);
    }

    10% {
        transform: translate(-12px, 8px);
    }

    20% {
        transform: translate(10px, -10px);
    }

    30% {
        transform: translate(-8px, -6px);
    }

    40% {
        transform: translate(8px, 8px);
    }

    50% {
        transform: translate(-5px, -5px);
    }

    60% {
        transform: translate(5px, 4px);
    }

    70% {
        transform: translate(-3px, 2px);
    }

    80% {
        transform: translate(2px, -2px);
    }

    100% {
        transform: translate(0, 0);
    }
}


/* =========================================
   最終メッセージ
========================================= */

@keyframes finalMessageAnimation {

    0% {

        opacity: 0;

        transform:
            scale(0.7);
    }

    60% {

        opacity: 1;

        transform:
            scale(1.08);
    }

    100% {

        opacity: 1;

        transform:
            scale(1);
    }
}


/* =========================================
   スマートフォン
========================================= */

@media (max-width: 600px) {

    #timer {

        margin-bottom: 50px;

        width: 8ch;
    }


    #answer {

        width: 75vw;

        height: 60px;

        font-size: 32px;
    }


    #controlArea {

        width: 100px;

        height: 100px;
    }
}

</style>

</head>


<body>


<div id="game">


    <!--
        右上の透明な操作領域

        待機中
        → スタート

        成功・爆発後
        → リセット
    -->

    <div id="controlArea"></div>


    <!-- タイマー -->

    <div id="timer">
        100.00
    </div>


    <!-- 入力欄 -->

    <input
        type="text"
        id="answer"

        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"

        spellcheck="false"
    >


    <!-- 結果画面 -->

    <div id="result">

        <div id="resultText"></div>

        <div id="finalMessage"></div>

    </div>


</div>



<script>

/* =========================================
   設定
========================================= */

const ANSWER = "だかい";

const START_TIME = 100.00;


/* =========================================
   HTML要素
========================================= */

const game =
    document.getElementById("game");


const timerElement =
    document.getElementById("timer");


const answerElement =
    document.getElementById("answer");


const resultElement =
    document.getElementById("result");


const resultTextElement =
    document.getElementById("resultText");


const finalMessageElement =
    document.getElementById("finalMessage");


const controlArea =
    document.getElementById("controlArea");


/* =========================================
   状態
========================================= */

let timeLeft =
    START_TIME;


let timer = null;

let startTime = null;


let state = "waiting";


/*
    waiting
    ↓
    開始前

    running
    ↓
    カウントダウン

    success
    ↓
    解除成功

    exploded
    ↓
    爆発
*/


/* =========================================
   Audio
========================================= */

let audioContext = null;

let countdownInterval = null;


/* =========================================
   Audio初期化
========================================= */

function initAudio() {

    if (!audioContext) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();
    }


    if (
        audioContext.state === "suspended"
    ) {

        audioContext.resume();
    }
}


/* =========================================
   機械的なカウントダウン音
========================================= */

function playMechanicalBeep(
    frequency,
    duration = 0.12
) {

    if (!audioContext) {

        return;
    }


    const now =
        audioContext.currentTime;


    /*
        メインの電子音
    */

    const oscillator =
        audioContext.createOscillator();


    const gain =
        audioContext.createGain();


    /*
        square波
        → 機械的な音
    */

    oscillator.type =
        "square";


    oscillator.frequency.setValueAtTime(
        frequency,
        now
    );


    gain.gain.setValueAtTime(
        0.0001,
        now
    );


    gain.gain.exponentialRampToValueAtTime(
        0.12,
        now + 0.005
    );


    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + duration
    );


    oscillator.connect(gain);

    gain.connect(
        audioContext.destination
    );


    oscillator.start(now);

    oscillator.stop(
        now + duration
    );


    /*
        高周波の電子クリック
    */

    const click =
        audioContext.createOscillator();


    const clickGain =
        audioContext.createGain();


    click.type =
        "square";


    click.frequency.setValueAtTime(
        frequency * 2.5,
        now
    );


    clickGain.gain.setValueAtTime(
        0.0001,
        now
    );


    clickGain.gain.exponentialRampToValueAtTime(
        0.035,
        now + 0.003
    );


    clickGain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + 0.045
    );


    click.connect(clickGain);

    clickGain.connect(
        audioContext.destination
    );


    click.start(now);

    click.stop(
        now + 0.05
    );
}


/* =========================================
   カウントダウン音開始
========================================= */

function startCountdownSound() {

    stopCountdownSound();


    /*
        開始直後も
        通常時と同じ音
    */

    playMechanicalBeep(
        450,
        0.12
    );


    /*
        1秒ごとのカウントダウン
    */

    countdownInterval =
        setInterval(() => {

            if (
                state !== "running"
            ) {

                return;
            }


            /*
                残り5秒以下
            */

            if (
                timeLeft <= 5
            ) {

                playMechanicalBeep(
                    950,
                    0.09
                );


                setTimeout(() => {

                    if (
                        state === "running" &&
                        timeLeft > 0
                    ) {

                        playMechanicalBeep(
                            1250,
                            0.055
                        );
                    }

                }, 250);

            }


            /*
                残り10秒以下
            */

            else if (
                timeLeft <= 10
            ) {

                playMechanicalBeep(
                    750,
                    0.10
                );

            }


            /*
                残り20秒以下
            */

            else if (
                timeLeft <= 20
            ) {

                playMechanicalBeep(
                    600,
                    0.11
                );

            }


            /*
                通常
            */

            else {

                playMechanicalBeep(
                    450,
                    0.12
                );
            }

        }, 1000);
}


/* =========================================
   カウントダウン音停止
========================================= */

function stopCountdownSound() {

    if (
        countdownInterval !== null
    ) {

        clearInterval(
            countdownInterval
        );

        countdownInterval = null;
    }
}


/* =========================================
   成功音
========================================= */

function playSuccessSound() {

    if (!audioContext) {

        return;
    }


    /*
        解除成功時の
        上昇ファンファーレ
    */

    playTone(
        523,
        0.15,
        0.0
    );


    playTone(
        659,
        0.15,
        0.16
    );


    playTone(
        784,
        0.20,
        0.32
    );


    playTone(
        1047,
        0.45,
        0.48
    );
}


function playTone(
    frequency,
    duration,
    delay
) {

    setTimeout(() => {

        if (!audioContext) {

            return;
        }


        const oscillator =
            audioContext.createOscillator();


        const gain =
            audioContext.createGain();


        oscillator.type =
            "sine";


        oscillator.frequency.value =
            frequency;


        gain.gain.setValueAtTime(
            0.0001,
            audioContext.currentTime
        );


        gain.gain.exponentialRampToValueAtTime(
            0.2,
            audioContext.currentTime + 0.02
        );


        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            audioContext.currentTime + duration
        );


        oscillator.connect(gain);

        gain.connect(
            audioContext.destination
        );


        oscillator.start();


        oscillator.stop(
            audioContext.currentTime
            + duration
        );

    }, delay * 1000);
}


/* =========================================
   爆発音
========================================= */

function playExplosionSound() {

    if (!audioContext) {

        return;
    }


    const now =
        audioContext.currentTime;


    /*
        爆発のノイズ
    */

    const bufferSize =
        audioContext.sampleRate
        * 1.2;


    const buffer =
        audioContext.createBuffer(
            1,
            bufferSize,
            audioContext.sampleRate
        );


    const data =
        buffer.getChannelData(0);


    for (
        let i = 0;
        i < bufferSize;
        i++
    ) {

        data[i] =
            Math.random() * 2 - 1;
    }


    const noise =
        audioContext.createBufferSource();


    noise.buffer =
        buffer;


    /*
        ローパスフィルター
    */

    const filter =
        audioContext.createBiquadFilter();


    filter.type =
        "lowpass";


    filter.frequency.setValueAtTime(
        1500,
        now
    );


    filter.frequency.exponentialRampToValueAtTime(
        80,
        now + 1
    );


    /*
        音量
    */

    const gain =
        audioContext.createGain();


    gain.gain.setValueAtTime(
        0.9,
        now
    );


    gain.gain.exponentialRampToValueAtTime(
        0.01,
        now + 1
    );


    noise.connect(filter);

    filter.connect(gain);

    gain.connect(
        audioContext.destination
    );


    noise.start(now);

    noise.stop(
        now + 1
    );


    /*
        低い衝撃音
    */

    const oscillator =
        audioContext.createOscillator();


    const oscGain =
        audioContext.createGain();


    oscillator.type =
        "sine";


    oscillator.frequency.setValueAtTime(
        100,
        now
    );


    oscillator.frequency.exponentialRampToValueAtTime(
        35,
        now + 0.7
    );


    oscGain.gain.setValueAtTime(
        0.8,
        now
    );


    oscGain.gain.exponentialRampToValueAtTime(
        0.01,
        now + 0.7
    );


    oscillator.connect(
        oscGain
    );


    oscGain.connect(
        audioContext.destination
    );


    oscillator.start(now);

    oscillator.stop(
        now + 0.7
    );
}


/* =========================================
   タイマー表示
========================================= */

function updateTimer() {

    timerElement.textContent =
        timeLeft.toFixed(2);


    /*
        残り20秒以下で警告
    */

    if (
        timeLeft <= 20
    ) {

        timerElement.classList.add(
            "warning"
        );

    } else {

        timerElement.classList.remove(
            "warning"
        );
    }
}


/* =========================================
   成功演出
   光の粒＋紙吹雪
========================================= */

function createSuccessSparks() {

    /*
        光の粒
    */

    for (
        let i = 0;
        i < 80;
        i++
    ) {

        const spark =
            document.createElement("div");


        spark.className =
            "spark";


        const angle =
            Math.random()
            * Math.PI
            * 2;


        const distance1 =
            80
            +
            Math.random() * 180;


        const distance2 =
            300
            +
            Math.random() * 600;


        const x1 =
            Math.cos(angle)
            * distance1;


        const y1 =
            Math.sin(angle)
            * distance1;


        const x2 =
            Math.cos(angle)
            * distance2;


        const y2 =
            Math.sin(angle)
            * distance2;


        spark.style.setProperty(
            "--x1",
            `${x1}px`
        );


        spark.style.setProperty(
            "--y1",
            `${y1}px`
        );


        spark.style.setProperty(
            "--x2",
            `${x2}px`
        );


        spark.style.setProperty(
            "--y2",
            `${y2}px`
        );


        const colors = [
            "#ff3366",
            "#ffcc00",
            "#00ccff",
            "#66ff66",
            "#cc66ff",
            "#ff66cc"
        ];


        const color =
            colors[
                Math.floor(
                    Math.random()
                    * colors.length
                )
            ];


        spark.style.background =
            color;


        spark.style.boxShadow =
            `0 0 10px ${color},
             0 0 25px ${color}`;


        resultElement.appendChild(
            spark
        );


        setTimeout(() => {

            spark.remove();

        }, 2000);
    }


    /*
        紙吹雪
    */

    for (
        let i = 0;
        i < 100;
        i++
    ) {

        const confetti =
            document.createElement("div");


        confetti.className =
            "confetti";


        const x =
            (Math.random() - 0.5)
            * 140
            + "vw";


        const duration =
            2.5
            +
            Math.random() * 2;


        const delay =
            Math.random() * 0.8;


        const rotation =
            (Math.random() - 0.5)
            * 1600;


        confetti.style.left =
            Math.random() * 100
            + "vw";


        confetti.style.setProperty(
            "--x",
            x
        );


        confetti.style.setProperty(
            "--duration",
            `${duration}s`
        );


        confetti.style.setProperty(
            "--delay",
            `${delay}s`
        );


        confetti.style.setProperty(
            "--rotation",
            `${rotation}deg`
        );


        const colors = [
            "#ff3366",
            "#ffcc00",
            "#00ccff",
            "#66ff66",
            "#cc66ff",
            "#ff66cc",
            "#ff8800"
        ];


        const color =
            colors[
                Math.floor(
                    Math.random()
                    * colors.length
                )
            ];


        confetti.style.background =
            color;


        confetti.style.width =
            6 + Math.random() * 10
            + "px";


        confetti.style.height =
            10 + Math.random() * 18
            + "px";


        resultElement.appendChild(
            confetti
        );


        setTimeout(() => {

            confetti.remove();

        }, 5000);
    }
}


/* =========================================
   ゲーム開始
========================================= */

function startGame() {

    if (
        state !== "waiting"
    ) {

        return;
    }


    /*
        タップ直後に
        AudioContextを開始
    */

    initAudio();


    state =
        "running";


    startTime =
        performance.now();


    /*
        入力欄にフォーカス
    */

    answerElement.focus();


    /*
        カウントダウン音
    */

    startCountdownSound();


    /*
        タイマー開始
    */

    timer =
        setInterval(() => {

            const elapsed =
                (
                    performance.now()
                    -
                    startTime
                )
                /
                1000;


            timeLeft =
                Math.max(
                    0,

                    START_TIME
                    -
                    elapsed
                );


            updateTimer();


            /*
                0秒
            */

            if (
                timeLeft <= 0
            ) {

                clearInterval(
                    timer
                );


                timeLeft =
                    0;


                updateTimer();


                explode();
            }

        }, 10);
}


/* =========================================
   正解判定
========================================= */

answerElement.addEventListener(
    "input",
    function () {

        if (
            state !== "running"
        ) {

            return;
        }


        const answer =
            answerElement.value.trim();


        if (
            answer === ANSWER
        ) {

            defuse();
        }
    }
);


/* =========================================
   解除成功
========================================= */

function defuse() {

    if (
        state !== "running"
    ) {

        return;
    }


    state =
        "success";


    /*
        ★重要★

        結果画面を表示するより先に
        元のタイマーと入力欄を隠す

        → 成功演出の背景に
          タイマーが一瞬映らない
    */

    game.classList.add(
        "resultMode"
    );


    /*
        タイマー停止
    */

    clearInterval(
        timer
    );


    /*
        カウントダウン音停止
    */

    stopCountdownSound();


    /*
        成功ファンファーレ
    */

    playSuccessSound();


    /*
        成功画面
    */

    resultElement.style.display =
        "flex";

    resultElement.className =
        "success";


    /*
        爆弾解除成功
    */

    resultTextElement.textContent =
        "爆弾解除成功";


    resultTextElement.style.opacity =
        "1";


    finalMessageElement.textContent =
        "";

    finalMessageElement.style.opacity =
        "0";


    /*
        光の粒＋紙吹雪
    */

    createSuccessSparks();


    answerElement.blur();
}


/* =========================================
   爆発
========================================= */

function explode() {

    if (
        state !== "running"
    ) {

        return;
    }


    state =
        "exploded";


    /*
        ★重要★

        爆発演出を表示する前に
        元のタイマーを完全に隠す
    */

    game.classList.add(
        "resultMode"
    );


    /*
        カウントダウン音停止
    */

    stopCountdownSound();


    /*
        爆発音
    */

    playExplosionSound();


    /*
        爆発画面
    */

    resultElement.style.display =
        "flex";

    resultElement.className =
        "explosion shake";


    /*
        「爆発」という文字は表示しない
    */

    resultTextElement.textContent =
        "";

    resultTextElement.style.opacity =
        "0";


    finalMessageElement.textContent =
        "";

    finalMessageElement.style.opacity =
        "0";


    answerElement.blur();


    /*
        爆発演出終了後
        「爆弾解除失敗」
    */

    setTimeout(() => {

        showFinalMessage(
            "爆弾解除失敗"
        );

    }, 1800);
}


/* =========================================
   最終メッセージ
========================================= */

function showFinalMessage(
    message
) {

    resultTextElement.style.opacity =
        "0";


    finalMessageElement.textContent =
        message;


    finalMessageElement.style.animation =
        "none";


    void finalMessageElement.offsetWidth;


    finalMessageElement.style.animation =
        "finalMessageAnimation 0.8s ease-out forwards";
}


/* =========================================
   右上タップ
========================================= */

controlArea.addEventListener(
    "pointerdown",
    function (event) {

        event.stopPropagation();


        /*
            待機中
            → スタート
        */

        if (
            state === "waiting"
        ) {

            startGame();

            return;
        }


        /*
            成功・爆発後
            → リセット
        */

        if (
            state === "success" ||
            state === "exploded"
        ) {

            resetGame();

            return;
        }

    }
);


/* =========================================
   リセット
========================================= */

function resetGame() {

    if (
        state !== "success" &&
        state !== "exploded"
    ) {

        return;
    }


    /*
        タイマー停止
    */

    clearInterval(
        timer
    );


    /*
        カウントダウン音停止
    */

    stopCountdownSound();


    /*
        初期状態
    */

    timeLeft =
        START_TIME;


    state =
        "waiting";


    startTime =
        null;


    /*
        タイマーを100.00へ
    */

    updateTimer();


    /*
        入力欄を空にする
    */

    answerElement.value =
        "";


    /*
        警告解除
    */

    timerElement.classList.remove(
        "warning"
    );


    /*
        ★重要★

        元のタイマー画面を再表示
    */

    game.classList.remove(
        "resultMode"
    );


    /*
        結果画面を非表示
    */

    resultElement.style.display =
        "none";

    resultElement.className =
        "";


    /*
        結果文字を消す
    */

    resultTextElement.textContent =
        "";


    /*
        最終メッセージを消す
    */

    finalMessageElement.textContent =
        "";

    finalMessageElement.style.opacity =
        "0";


    /*
        成功演出の
        光・紙吹雪を削除
    */

    document
        .querySelectorAll(
            ".spark, .confetti"
        )
        .forEach(
            element =>
                element.remove()
        );


    /*
        フォーカスを外す
    */

    answerElement.blur();
}


/* =========================================
   初期化
========================================= */

updateTimer();

</script>


</body>

</html>
