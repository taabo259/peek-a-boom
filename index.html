<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Bomb Defusal</title>

<style>

    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;

        background: #ffffff;
        color: #000000;

        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Helvetica Neue",
            Arial,
            sans-serif;
    }

    body {
        display: flex;
        justify-content: center;
        align-items: center;

        user-select: none;
    }


    /* =========================
       ゲーム画面
    ========================= */

    #game {
        width: 100%;
        height: 100%;

        position: relative;

        display: flex;
        flex-direction: column;

        align-items: center;
        justify-content: center;

        background: #ffffff;
    }


    /* =========================
       タイマー
    ========================= */

    #timer {

        font-size: clamp(70px, 18vw, 180px);

        font-weight: 300;

        line-height: 1;

        letter-spacing: 0.03em;

        margin-bottom: 60px;

        transition:
            color 0.2s,
            transform 0.2s;
    }


    /* 残り20秒以下 */

    #timer.warning {

        animation: warningPulse 0.8s infinite;
    }


    @keyframes warningPulse {

        0%, 100% {
            transform: scale(1);
        }

        50% {
            transform: scale(1.05);
        }
    }


    /* =========================
       入力欄
    ========================= */

    #answer {

        width: min(75vw, 600px);

        height: 70px;

        border: none;

        border-bottom: 3px solid #000000;

        background: transparent;

        font-size: 40px;

        text-align: center;

        outline: none;

        border-radius: 0;

        user-select: text;

        -webkit-user-select: text;
    }


    /* =========================
       結果画面
    ========================= */

    #result {

        position: absolute;

        top: 0;
        left: 0;

        width: 100%;
        height: 100%;

        display: none;

        justify-content: center;
        align-items: center;

        text-align: center;

        z-index: 10;
    }


    #resultText {

        font-size: clamp(60px, 15vw, 160px);

        font-weight: 700;

        letter-spacing: 0.08em;
    }


    /* =========================
       解除成功
    ========================= */

    .success {

        background: #ffffff;

        color: #000000;
    }


    .success #resultText {

        animation:
            successAnimation 1.5s ease-out forwards;
    }


    @keyframes successAnimation {

        0% {

            opacity: 0;

            transform:
                scale(0.3);
        }

        40% {

            opacity: 1;

            transform:
                scale(1.2);
        }

        70% {

            transform:
                scale(0.95);
        }

        100% {

            transform:
                scale(1);
        }
    }


    /* =========================
       爆発
    ========================= */

    .explosion {

        /*
            以前の激しい明滅を削除
        */

        background: #000000;

        color: #ffffff;
    }


    /*
        解除成功と似た、
        フェード＋拡大演出
    */

    .explosion #resultText {

        animation:
            explosionAnimation 1.5s ease-out forwards;
    }


    @keyframes explosionAnimation {

        0% {

            opacity: 0;

            transform:
                scale(0.3);
        }

        40% {

            opacity: 1;

            transform:
                scale(1.2);
        }

        70% {

            transform:
                scale(0.95);
        }

        100% {

            opacity: 1;

            transform:
                scale(1);
        }
    }


    /* =========================
       ステータス
    ========================= */

    #status {

        position: absolute;

        bottom: 25px;

        font-size: 14px;

        letter-spacing: 0.15em;

        opacity: 0.5;
    }


    /* =========================
       スマートフォン
    ========================= */

    @media (max-width: 600px) {

        #timer {

            margin-bottom: 50px;
        }

        #answer {

            width: 75vw;

            height: 60px;

            font-size: 32px;
        }

        #status {

            bottom: 15px;

            font-size: 11px;
        }
    }

</style>

</head>


<body>

<div id="game">

    <!-- タイマー -->

    <div id="timer">
        100.00
    </div>


    <!-- 入力欄 -->

    <input
        type="text"
        id="answer"

        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"

        spellcheck="false"
    >


    <div id="status"></div>


    <!-- 結果画面 -->

    <div id="result">

        <div id="resultText"></div>

    </div>

</div>


<script>


    /* =========================
       設定
    ========================= */

    const ANSWER = "だかい";

    const START_TIME = 100.00;


    /* =========================
       HTML要素
    ========================= */

    const timerElement =
        document.getElementById("timer");

    const answerElement =
        document.getElementById("answer");

    const resultElement =
        document.getElementById("result");

    const resultTextElement =
        document.getElementById("resultText");

    const statusElement =
        document.getElementById("status");


    /* =========================
       状態
    ========================= */

    let timeLeft = START_TIME;

    let timer = null;

    let startTime = null;


    /*
        waiting
        → 開始前

        running
        → カウントダウン中

        success
        → 解除成功

        exploded
        → 爆発
    */

    let state = "waiting";


    /* =========================
       タイマー表示
    ========================= */

    function updateTimer() {

        /*
            小数第2位まで表示

            例

            100.00
            99.99
            99.98
            ...
            0.01
            0.00
        */

        timerElement.textContent =
            timeLeft.toFixed(2);


        /*
            残り20秒以下で警告
        */

        if (timeLeft <= 20) {

            timerElement.classList.add(
                "warning"
            );

        } else {

            timerElement.classList.remove(
                "warning"
            );
        }
    }


    /* =========================
       ゲーム開始
    ========================= */

    function startGame() {

        if (state !== "waiting") {
            return;
        }


        state = "running";


        statusElement.textContent = "";


        /*
            開始時刻を記録

            setIntervalのズレを防ぐため、
            実際の経過時間から残り時間を計算します。
        */

        startTime = performance.now();


        /*
            入力欄にフォーカス
        */

        answerElement.focus();


        /*
            約10msごとに更新
        */

        timer = setInterval(() => {

            const elapsed =
                (performance.now() - startTime)
                / 1000;


            timeLeft =
                Math.max(
                    0,
                    START_TIME - elapsed
                );


            updateTimer();


            /*
                0秒になった
            */

            if (timeLeft <= 0) {

                clearInterval(timer);

                timeLeft = 0;

                updateTimer();

                explode();
            }

        }, 10);
    }


    /* =========================
       正解判定
    ========================= */

    answerElement.addEventListener(
        "input",
        function () {

            if (state !== "running") {
                return;
            }


            const answer =
                answerElement.value.trim();


            /*
                「だかい」と完全一致
            */

            if (answer === ANSWER) {

                defuse();
            }
        }
    );


    /* =========================
       解除成功
    ========================= */

    function defuse() {

        if (state !== "running") {
            return;
        }


        state = "success";


        clearInterval(timer);


        /*
            成功画面
        */

        resultElement.style.display =
            "flex";

        resultElement.className =
            "success";


        resultTextElement.textContent =
            "解除成功";


        /*
            入力欄からフォーカスを外す
        */

        answerElement.blur();
    }


    /* =========================
       爆発
    ========================= */

    function explode() {

        if (state !== "running") {
            return;
        }


        state = "exploded";


        /*
            爆発画面
        */

        resultElement.style.display =
            "flex";


        resultElement.className =
            "explosion";


        resultTextElement.textContent =
            "爆発";
    }


    /* =========================
       リセット
    ========================= */

    function resetGame() {

        if (
            state !== "success" &&
            state !== "exploded"
        ) {
            return;
        }


        clearInterval(timer);


        /*
            初期状態に戻す
        */

        timeLeft =
            START_TIME;


        state =
            "waiting";


        startTime =
            null;


        /*
            表示を戻す
        */

        updateTimer();


        answerElement.value = "";


        timerElement.classList.remove(
            "warning"
        );


        resultElement.style.display =
            "none";


        resultElement.className =
            "";


        resultTextElement.textContent =
            "";


        /*
            入力欄のフォーカスを外す
        */

        answerElement.blur();
    }


    /* =========================
       画面タッチ
    ========================= */

    document.addEventListener(
        "pointerdown",
        function (event) {

            /*
                成功・爆発後

                → 画面タッチでリセット
            */

            if (
                state === "success" ||
                state === "exploded"
            ) {

                resetGame();

                return;
            }


            /*
                開始前

                → 画面タッチで開始
            */

            if (state === "waiting") {

                startGame();
            }

        }
    );


    /* =========================
       初期化
    ========================= */

    updateTimer();

</script>

</body>
</html>
